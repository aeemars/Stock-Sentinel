# ==============================================================================
# Cloudflare Tunnel Configuration Example (cloudflared)
# Use this file to connect your Stock Sentinel instance directly to Cloudflare
# without opening firewall ports or exposing IP addresses.
# ==============================================================================

tunnel: <YOUR-TUNNEL-UUID>
credentials-file: /root/.cloudflared/<YOUR-TUNNEL-UUID>.json

ingress:
  # Map public hostname to the local FastAPI Uvicorn service
  - hostname: stocks.yourdomain.com
    service: http://127.0.0.1:5000
    originRequest:
      noTLSVerify: false
      httpHostHeader: stocks.yourdomain.com

  # Fallback 404 for unmatched traffic
  - service: http_status:404
