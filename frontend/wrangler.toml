# ==============================================================================
# Stock Sentinel — Cloudflare Workers Configuration
# ==============================================================================
name = "stock-sentinel"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------------------
# Cloudflare Workers Static Assets
# Serves static files directly from Cloudflare's global edge network
# ------------------------------------------------------------------------------
[assets]
directory = "./static"
binding = "ASSETS"

# ------------------------------------------------------------------------------
# Scheduled Cron Triggers
# 1. Market Close Scan: Monday through Friday at 20:30 UTC (4:30 PM EST market close + buffer)
# 2. Keep-Alive Ping: Every 14 minutes during active hours (07:00–22:00 UTC / 8 AM–11 PM WAT)
#    Saves ~285 free hours/month so you never exceed Render's 750h quota.
# ------------------------------------------------------------------------------
[triggers]
crons = [
  "30 20 * * 1-5",
  "*/14 7-21 * * *"
]

# ------------------------------------------------------------------------------
# Environment Variables (Public / Non-sensitive)
# ------------------------------------------------------------------------------
[vars]
ENVIRONMENT = "cloudflare"
# Set this to your FastAPI origin on Render (e.g. https://stock-sentinel.onrender.com)
BACKEND_ORIGIN = "https://stock-sentinel-zcrs.onrender.com"
MARKET_CLOSE_HOUR = "16"
MARKET_CLOSE_MINUTE = "30"

# ------------------------------------------------------------------------------
# Secrets (DO NOT put secrets here — set them via CLI or Cloudflare Dashboard)
# Run these commands to register your secrets securely in Cloudflare:
#   npx wrangler secret put CRON_SECRET
#   npx wrangler secret put SECRET_KEY
#   npx wrangler secret put NEON_DATABASE_URL
#   npx wrangler secret put OPENROUTER_API_KEY
# ------------------------------------------------------------------------------
